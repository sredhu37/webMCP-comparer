<!doctype html>
<html><head><meta charset="utf-8"><title>child</title></head>
<body>child
<script>
  const name = new URLSearchParams(location.search).get('name') || 'child_tool';
  const mc = document.modelContext || navigator.modelContext;
  try {
    mc?.registerTool({ name, description: 'Tool registered inside an iframe.', execute: async () => 'from ' + location.origin });
    document.body.append(' registered ' + name);
  } catch (e) {
    document.body.append(' register failed: ' + e.message);
  }
</script>
</body></html>
